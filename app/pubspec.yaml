name: niyah
description: "Niyah: promemoria per rinnovare l'intenzione (niyyah). Offline, senza pubblicità."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  niyah_core:
    path: ../packages/niyah_core

  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  sqflite: ^2.4.4+2
  path: ^1.9.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Database iniziale: generato da tool/prepare_seed.sh (non è nel repository).
    - assets/databases/
    - assets/fonts/OFL-PlusJakartaSans.txt
    - assets/fonts/OFL-IBMPlexSansArabic.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
