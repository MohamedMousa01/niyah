name: niyah
description: "MyNiyah — renew your intention. Offline-first reminders app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.0
  intl: ^0.20.3
  niyah_core:
    path: ../../packages/niyah_core
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/db/niyah_seed.db
    - assets/fonts/OFL-Amiri.txt
    - assets/fonts/OFL-PlusJakartaSans.txt

  # OFL fonts from github.com/google/fonts (licences in assets/fonts/OFL-*.txt).
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VariableFont_wght.ttf
